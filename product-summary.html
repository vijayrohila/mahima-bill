<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Summary - Software Billing System</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Flatpickr (date picker with DD-MM-YYYY format) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>Product Summary</h1>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;"><span id="productSummaryCompanyLabel" style="color: white; font-size: 0.95rem;"></span>
            <button id="btnBack" class="btn btn-secondary">Back to RCC Records</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <div class="form-actions" style="margin-bottom: 1rem;">
            <button id="btnDownloadPDF" class="btn btn-success">Download PDF</button>
        </div>
        <!-- Filters -->
        <div style="margin-bottom: 1rem; background: #f8f9fa; padding: 1rem; border-radius: 5px;">
            <div class="form-row" style="margin-bottom: 1rem;">
                <div class="form-field">
                    <label>From Date</label>
                    <input type="text" id="filterFromDate" placeholder="DD-MM-YYYY" style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 5px; background: #fff;">
                </div>
                <div class="form-field">
                    <label>To Date</label>
                    <input type="text" id="filterToDate" placeholder="DD-MM-YYYY" style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 5px; background: #fff;">
                </div>
                <div class="form-field">
                    <label>Filter by Ralti</label>
                    <select id="filterRalti" style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 5px;">
                        <option value="">All</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-field" style="display: flex; align-items: flex-end;">
                    <button id="btnClearFilters" class="btn btn-secondary" style="width: 100%;">Clear Filters</button>
                </div>
            </div>
            <div class="form-row" style="margin-top: 0.75rem;">
                <div class="form-field full-width">
                    <label>PDF Columns</label>
                    <label style="display: flex; align-items: center; gap: 0.5rem; padding-top: 0.5rem;">
                        <input type="checkbox" id="filterShowBRatePdf" checked>
                        Show B Rate in PDF
                    </label>
                </div>
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>S.NO</th>
                    <th>MATERIAL</th>
                    <th>QTY</th>
                    <th>RS</th>
                    <th>B Rate</th>
                    <th>B Amount</th>
                    <th>AMT</th>
                    <th>GST</th>
                    <th>AMT WITH GST</th>
                </tr>
            </thead>
            <tbody id="productSummaryTableBody">
                <!-- Product summary will be loaded here -->
            </tbody>
        </table>
    </div>

    <div id="apiLoaderOverlay" class="api-loader-overlay" aria-hidden="true">
        <div class="api-loader-spinner" role="status" aria-label="Loading"></div>
    </div>

    <script src="api-loader-install.js"></script>
    <script src="product-summary.js"></script>
</body>
</html>
